seed:
  seed: null
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  keep_checkpoints: False
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  max_grad_norm: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  huber_delta: 10.0
logger:
  log_dir: "./results"
