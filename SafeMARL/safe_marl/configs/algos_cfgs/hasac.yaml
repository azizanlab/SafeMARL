seed:
  seed: null
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 10
  num_env_steps: 2000000
  warmup_steps: 10000
  train_interval: 50
  update_per_train: 1
  eval_interval: 4000
  log_interval: 1000
  keep_checkpoints: False
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
model:
  hidden_sizes: [256, 256]
  activation_func: relu
  final_activation_func: tanh
  lr: 0.001
  critic_lr: 0.0003
algo:
  alpha: 0.2
  gamma: 0.99
  buffer_size: 1000000
  batch_size: 1000
  polyak: 0.005
  n_step: 5
logger:
  log_dir: "./results"
